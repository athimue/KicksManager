buildscript {
    ext {
        // SDK
        minSdk = 29
        compileSdk = 37
        targetSdk = 37

        // Kotlin
        kotlin_version = "2.4.21"
        ksp_version = "2.3.13"
        coroutine_core = "1.11.0"
        kotlin_serialization_version = "1.12.0"

        // AndroidX
        compose_bom = "2026.09.00"
        activity_compose_version = "1.13.0"
        core_ktx_version = "1.19.1"
        lifecycle_version = "2.11.0"
        nav_version = "2.10.2"
        room_version = "2.8.5"

        // DI
        hilt_version = "2.60.1"
        androidx_hilt_version = "1.3.0"

        // Network
        retrofit2 = "3.0.0"
        okhttp3 = "5.5.1"

        // Coil
        coil_version = "3.5.0"

        // Unit test
        junit = "4.13.2"

        // Android test
        espresso = "3.7.0"
        android_junit = "1.3.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9 embarque Kotlin ; on force une version de KGP plus récente que celle fournie par défaut
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'com.android.application' version '9.5.0' apply false
    id 'com.android.library' version '9.5.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.21' apply false
    id 'com.google.dagger.hilt.android' version '2.60.1' apply false
    id 'com.google.devtools.ksp' version '2.3.13' apply false
}
